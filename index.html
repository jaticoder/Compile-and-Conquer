<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1a2e">
  <title>Compile &amp; Conquer</title>
  <meta name="description" content="Belajar C++ sambil ngalahin boss. Tulis kodenya, boss-nya tumbang.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>

  <header class="topbar">
    <h1 class="brand">Compile &amp; Conquer</h1>
    <p class="progress">
      <span id="hudTier">Basic</span>
      <span id="hudLevel">Level 1 dari 5</span>
    </p>
    <button class="mute" id="muteBtn" type="button" aria-pressed="false">Suara: nyala</button>
  </header>

  <main class="game">

    <!-- Arena: hero di kiri, boss di kanan. Bingkai bata mengelilingi scene. -->
    <div class="frame">
      <section class="stage tier-basic" id="stage" aria-label="Arena pertarungan">
        <div class="coins" aria-label="Boss yang sudah dikalahkan">
          <i class="coin" aria-hidden="true"></i>
          <span>x <b id="coinCount">0</b></span>
        </div>

        <div class="plate">
          <span class="plate-name" id="bossName"></span>
          <div class="hp" aria-hidden="true"><i id="hpFill"></i></div>
        </div>

        <div class="sprite hero" id="hero"></div>
        <div class="sprite boss" id="boss"></div>
        <div class="projectile" id="projectile" hidden><i class="orb"></i></div>
        <div class="fx" id="fx" aria-hidden="true"></div>
        <div class="pop" id="pop" hidden></div>
        <div class="flash" id="flash" aria-hidden="true"></div>
      </section>
    </div>

    <section class="panels">

      <!-- Soal -->
      <article class="quest">
        <h2 id="taskTitle">Memuat level...</h2>
        <p id="taskDesc"></p>
        <div class="expected">
          <span>Output yang harus keluar</span>
          <code id="taskExpected"></code>
        </div>
        <label class="toggle">
          <input type="checkbox" id="ghostToggle" checked>
          <span>Tampilkan panduan abu-abu</span>
        </label>
        <p class="note">Panduan cuma nunjukin baris berikutnya. Ketik sendiri semuanya, dari <code>#include</code>.</p>
      </article>

      <!-- Editor + hasil -->
      <article class="code">
        <div id="editor"></div>
        <div class="keys" id="keys" aria-label="Tombol simbol cepat"></div>
        <div class="actions">
          <button class="btn" id="runBtn" type="button">Jalankan ▶</button>
          <button class="btn ghost" id="resetBtn" type="button">Reset kode</button>
          <span class="shortcut">Ctrl + Enter</span>
        </div>
        <div class="console" id="console" aria-live="polite">Tulis kodenya, lalu klik Jalankan.</div>
      </article>

    </section>
  </main>

  <!-- Popup kalau boss kalah -->
  <!-- Kilat merah kalau kode salah -->
  <div class="alarm" id="alarm" aria-hidden="true"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Boss kalah!</h2>
      <p id="modalText"></p>
      <button class="btn" id="nextBtn" type="button">Level berikutnya</button>
    </div>
  </div>

  <script src="js/levels.js?v=5"></script>
  <script src="js/sound.js?v=5"></script>
  <script src="js/errors.js?v=5"></script>
  <script src="js/judge.js?v=5"></script>
  <script src="js/editor.js?v=6"></script>
  <script src="js/game.js?v=5"></script>
</body>
</html>
